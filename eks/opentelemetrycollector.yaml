apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: x-ray-collector-config
  namespace: my-cool-app
spec:
  mode: sidecar
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            
    extensions:
      health_check:
        check_collector_pipeline:
          enabled: true
          exporter_failure_threshold: 5
          interval: 5m
        endpoint: 0.0.0.0:13133

    processors:
      batch: {}
      resourcedetection:
        detectors: [env]
        timeout: 2s
        override: false
      memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
      

    exporters:
      awsxray:
        region: us-west-2
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, resourcedetection]
          exporters: [awsxray]
      telemetry:
        logs:
          level: debug
