name: CI Pipeline — BookShelf Cloud

# ─────────────────────────────────────────────
# Cuándo se ejecuta este pipeline:
#   - En cada Pull Request (hacia cualquier rama)
#   - En cada push a main
# ─────────────────────────────────────────────
on:
  pull_request:
  push:
    branches:
      - main

jobs:

# ══════════════════════════════════════════════
# JOB 1: Lint + Format + Tests
# ══════════════════════════════════════════════
  lint-and-test:
    name: 🧹 Lint, Format & Tests
    runs-on: ubuntu-latest

    services:
      # Base de datos Postgres para los tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Variables de entorno que usa la app FastAPI
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov

      - name: 🎨 Verificar formato con Black
        run: |
          black --check --diff app/
        # Si el código no está formateado, el job falla aquí
        # Para corregirlo localmente: black app/

      - name: 🔍 Lint con Flake8
        run: |
          flake8 app/ \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(text)s'
        # El formato anterior hace que los errores aparezcan
        # directamente anotados en el diff del PR

      - name: 🧪 Correr tests con Pytest
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v
        # --cov=app        → mide cobertura del directorio app/
        # --cov-report=xml → genera reporte para el summary

      - name: 📊 Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ══════════════════════════════════════════════
# JOB 2: Docker Build
# ══════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test   # Solo corre si lint-and-test pasa

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # No publica (sin GCP conectado aún)
          tags: |
            bookshelf-cloud:${{ github.sha }}
            bookshelf-cloud:latest
          cache-from: type=ghlayer
          cache-to: type=ghlayer,mode=max
          # ─────────────────────────────────────
          # NOTA PARA CUANDO SE CONECTE GCP:
          # Descomentar las siguientes líneas y
          # configurar los secrets en el repo:
          #
          # push: true
          # tags: |
          #   REGION-docker.pkg.dev/PROJECT_ID/bookshelf/api:${{ github.sha }}
          #   REGION-docker.pkg.dev/PROJECT_ID/bookshelf/api:latest
          # ─────────────────────────────────────

      - name: ✅ Confirmar build exitoso
        run: |
          echo "✅ Imagen construida: bookshelf-cloud:${{ github.sha }}"
          echo "📌 SHA del commit: ${{ github.sha }}"
          echo "🌿 Rama: ${{ github.ref_name }}"

# ══════════════════════════════════════════════
# JOB 3: Resumen accionable en el PR
# ══════════════════════════════════════════════
  summary:
    name: 📋 Resumen del CI
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: always()   # Corre aunque los jobs anteriores fallen

    steps:
      - name: 📝 Escribir resumen en GitHub Actions
        run: |
          echo "## 📋 Resumen del CI — BookShelf Cloud" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Lint & Format (Black + Flake8) | ${{ needs.lint-and-test.result == 'success' && '✅ Pasó' || '❌ Falló' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests (Pytest) | ${{ needs.lint-and-test.result == 'success' && '✅ Pasó' || '❌ Falló' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result == 'success' && '✅ Pasó' || '❌ Falló' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Rama:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ejecutado por:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Si algo falló, revisa los logs del job correspondiente arriba." >> $GITHUB_STEP_SUMMARY
